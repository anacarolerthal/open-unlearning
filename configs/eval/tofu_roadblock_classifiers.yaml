# @package eval.tofu

defaults:
  - tofu_metrics:
    - forget_Truth_Ratio
    - forget_quality
    - forget_Q_A_Prob
    - forget_Q_A_ROUGE
    - model_utility
    - privleak
    - extraction_strength
    - roadblock_classifier_quality

handler: TOFUEvaluator
output_dir: ${paths.output_dir}
metrics: {}
overwrite: true
forget_split: forget10
holdout_split: holdout10
retain_logs_path: null
question_key: question
batch_size: 32
