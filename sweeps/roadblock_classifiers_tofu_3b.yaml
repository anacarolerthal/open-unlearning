program: src/train.py
project: open-unlearning
method: grid
metric:
  name: forget_quality
  goal: maximize

parameters:
  trainer.method_args.classifier:
    values: [oracle, guard]
  trainer.method_args.strength:
    values: [5, 10, 20, 30, 42, 60, 80, 100]

command:
  - uv
  - run
  - python
  - src/train.py
  - --config-name=unlearn.yaml
  - experiment=unlearn/tofu/default.yaml
  - trainer=RoadBlock
  - eval=tofu_roadblock_classifiers
  - model=Llama-3.2-3B-Instruct
  - model.model_args.pretrained_model_name_or_path=open-unlearning/tofu_Llama-3.2-3B-Instruct_full
  - model.model_args.attn_implementation=sdpa
  - forget_split=forget10
  - retain_split=retain90
  - holdout_split=holdout10
  - retain_logs_path=saves/eval/tofu_Llama-3.2-3B-Instruct_retain90/TOFU_EVAL.json
  - trainer.args.learning_rate=1.0e-3
  - trainer.args.num_train_epochs=10
  - trainer.args.per_device_train_batch_size=8
  - trainer.args.seed=42
  - trainer.args.report_to=wandb
  - task_name=sweep_roadblock_3b_${trainer.method_args.classifier}_strength${trainer.method_args.strength}_${oc.env:WANDB_RUN_ID}
  - ${args_no_hyphens}
