defaults:
  - model: Llama-3.2-1B-Instruct
  - trainer: NPO
  - data: unlearn
  - collator: DataCollatorForSupervisedDataset
  - eval: tofu
  - hydra: default
  - paths: default
  - _self_

mode: continual
task_name: tofu_continual_${trainer.handler}
seed: 0

forget_split: forget05
retain_split: retain95
holdout_split: holdout05
retain_logs_path: saves/eval/tofu_Llama-3.2-1B-Instruct_retain95/TOFU_EVAL.json
question_key: question

model:
  model_args:
    pretrained_model_name_or_path: open-unlearning/tofu_Llama-3.2-1B-Instruct_full

continual:
  num_requests: 5
  examples_per_request: 40
  dataset_size: 200

data:
  anchor: forget
  forget:
    TOFU_QA_forget:
      args:
        hf_args:
          name: ${forget_split}
  retain:
    TOFU_QA_retain:
      args:
        hf_args:
          name: ${retain_split}

eval:
  tofu:
    forget_split: ${forget_split}
    holdout_split: ${holdout_split}
    retain_logs_path: ${retain_logs_path}
    overwrite: true
    question_key: ${question_key}

trainer:
  args:
    do_eval: false
    eval_strategy: 'no'
    eval_on_start: false
    save_strategy: 'no'
    remove_unused_columns: false
