# Register: wandb sweep sweeps/unlearn_head_tofu_1b.yaml
# Launch:   ./scripts/run_sweep_agent.sh <entity/project/sweep_id>
#
# Each W&B run trains one objective once, then evaluates the resulting in-memory
# checkpoint over the full inference-only lambda/router grid. This replaces the
# old training sweep plus one checkpoint-evaluation sweep per objective.
# Regenerate the retain reference after the attention-mask fix before launch;
# see docs/RESEARCH.md for the exact command.

program: src/train.py
project: unlearn-head
method: grid
metric:
  name: eval/grid/best_constrained_selection
  goal: maximize

parameters:
  trainer.method_args.objective:
    # Independent CE remains as the control. The two new objectives need full
    # correction-only curves before changing rank or training hyperparameters.
    values: [independent_ce, answer_contrast, direct_correction]

command:
  - uv
  - run
  - python
  - src/train.py
  - --config-name=unlearn.yaml
  - experiment=unlearn/tofu/default.yaml
  - eval=tofu_unlearn_head
  - trainer=UnlearnHead
  - model=Llama-3.2-1B-Instruct
  - model.model_args.pretrained_model_name_or_path=open-unlearning/tofu_Llama-3.2-1B-Instruct_full
  # Keep the sweep runnable without the optional, locally-compiled flash-attn package.
  # PyTorch SDPA still uses fused CUDA attention kernels when they are available.
  - model.model_args.attn_implementation=sdpa
  - forget_split=forget10
  - retain_split=retain90
  - holdout_split=holdout10
  - retain_logs_path=saves/eval/tofu_Llama-3.2-1B-Instruct_retain90_maskfix/TOFU_EVAL.json
  - trainer.method_args.rank=32
  - trainer.method_args.lam=1.0
  - trainer.method_args.router_mode=calibrated
  - trainer.method_args.normalize_correction=True
  # Dense coverage around the preservation boundary at lambda ~= 1, plus a
  # sparse high-strength tail to distinguish useful forgetting from collapse.
  - trainer.method_args.eval_lambdas=[0.0,0.25,0.5,0.75,1.0,1.25,1.5,2.0,3.0,4.0,6.0,8.0]
  # Oracle isolates correction quality, always_on exposes global damage, and
  # calibrated is the deployable end-to-end system.
  - trainer.method_args.eval_router_modes=[calibrated,always_on,oracle]
  # Fix the training budget. The previous epoch/batch grid confounded the
  # number of optimizer updates and decayed a new factorized head to zero LR.
  - trainer.args.learning_rate=1.0e-4
  - trainer.args.max_steps=250
  - trainer.args.per_device_train_batch_size=4
  - trainer.args.gradient_accumulation_steps=4
  - trainer.args.lr_scheduler_type=constant_with_warmup
  - trainer.args.warmup_epochs=0.0
  - trainer.args.warmup_ratio=0.03
  - trainer.args.weight_decay=0.0
  - trainer.args.report_to=wandb
  - trainer.args.eval_strategy=no
  - trainer.args.eval_on_start=False
  - +trainer.args.run_name=unlearn_head_grid_${trainer.method_args.objective}_${oc.env:WANDB_RUN_ID}
  - task_name=sweep_unlearn_head_grid_${trainer.method_args.objective}_${oc.env:WANDB_RUN_ID}
  - ${args_no_hyphens}
