# Register after choosing a trained head:
#   wandb sweep sweeps/unlearn_head_eval_tofu_1b.yaml
# Launch on the machine containing unlearn_head.pt:
#   UNLEARN_HEAD_CHECKPOINT=/absolute/path/to/unlearn_head.pt wandb agent <sweep>

program: src/train.py
project: unlearn-head
method: grid
metric:
  name: eval/constrained_selection
  goal: maximize

parameters:
  trainer.method_args.lam:
    # Dense post-training scan around the safe/destructive transition.
    values: [0.0, 0.25, 0.5, 0.75, 1.0, 1.5, 2.0, 3.0, 4.0, 6.0, 8.0]
  trainer.method_args.router_mode:
    # always_on diagnoses the correction, oracle isolates routing losses, and
    # calibrated is the deployable configuration.
    values: [calibrated, always_on, oracle]

command:
  - uv
  - run
  - python
  - src/train.py
  - --config-name=unlearn.yaml
  - experiment=unlearn/tofu/default.yaml
  - eval=tofu_unlearn_head
  - trainer=UnlearnHead
  - model=Llama-3.2-1B-Instruct
  - model.model_args.pretrained_model_name_or_path=open-unlearning/tofu_Llama-3.2-1B-Instruct_full
  - model.model_args.attn_implementation=sdpa
  - forget_split=forget10
  - retain_split=retain90
  - holdout_split=holdout10
  - retain_logs_path=saves/eval/tofu_Llama-3.2-1B-Instruct_retain90/TOFU_EVAL.json
  - trainer.method_args.head_checkpoint=${oc.env:UNLEARN_HEAD_CHECKPOINT}
  - trainer.method_args.normalize_correction=True
  - trainer.args.do_train=False
  - trainer.args.do_eval=True
  - trainer.args.report_to=wandb
  - trainer.args.eval_strategy=no
  - trainer.args.eval_on_start=False
  - +trainer.args.run_name=unlearn_head_eval_lam${trainer.method_args.lam}_${trainer.method_args.router_mode}_${oc.env:WANDB_RUN_ID}
  - task_name=sweep_unlearn_head_eval_lam${trainer.method_args.lam}_${trainer.method_args.router_mode}_${oc.env:WANDB_RUN_ID}
  - ${args_no_hyphens}
