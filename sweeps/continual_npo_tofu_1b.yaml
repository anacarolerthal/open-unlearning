program: src/continual_unlearn.py
project: continual-open-unlearning
method: grid
metric:
  name: eval/continual_forget_Q_A_Prob
  goal: minimize

parameters:
  trainer.args.seed:
    values: [42]
  trainer.args.learning_rate:
    values: [1.0e-6, 3.0e-6, 1.0e-5]
  trainer.args.max_steps:
    values: [10, 30, 60, 120]
  trainer.method_args.gamma:
    values: [1.0, 2.0]
  trainer.method_args.alpha:
    values: [1.0, 2.0]

command:
  - uv
  - run
  - python
  - src/continual_unlearn.py
  - --config-name=continual_unlearn.yaml
  - trainer=NPO
  - model=Llama-3.2-1B-Instruct
  - model.model_args.pretrained_model_name_or_path=open-unlearning/tofu_Llama-3.2-1B-Instruct_full
  - model.model_args.attn_implementation=sdpa
  - trainer.method_args.beta=0.1
  - trainer.method_args.retain_loss_type=NLL
  - trainer.args.num_train_epochs=10
  - trainer.args.per_device_train_batch_size=8
  - trainer.args.gradient_accumulation_steps=4
  - trainer.args.weight_decay=0.01
  - trainer.args.warmup_ratio=0.1
  - trainer.args.lr_scheduler_type=linear
  - trainer.args.report_to=wandb
  - seed=${trainer.args.seed}
  - task_name=sweep_continual_npo_seed${trainer.args.seed}_${oc.env:WANDB_RUN_ID}
  - ${args_no_hyphens}
