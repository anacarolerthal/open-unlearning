defaults:
  - finetune

handler: UnlearnHead
method_args:
  rank: 16
  lora_alpha: 16
  lora_dropout: 0.0
  lam: 1.0
  # Use oracle to gate true forget examples on and all other datasets off.
  classifier: likelihood_ratio
  epsilon: 0.05
  calibrate: false
  prompt_loss_weight: 1.0
  diagnostics_max_samples: 128
