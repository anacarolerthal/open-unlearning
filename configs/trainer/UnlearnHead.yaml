defaults:
  - finetune

handler: UnlearnHead
args:
  # Newly initialized factorized heads benefit from a stable learning rate.
  lr_scheduler_type: constant_with_warmup
  warmup_ratio: 0.03
  max_steps: -1
  optim: adamw_torch
method_args:
  rank: 32
  lam: 1.0
  epsilon: 0.05
  router_mode: calibrated
  objective: independent_ce
  answer_contrast_weight: 1.0
  answer_contrast_margin: 0.1
  direct_beta: 0.1
  scale_regularization_weight: 1.0e-3
  normalize_correction: true
  head_checkpoint: null
  prompt_loss_weight: 0.1
  diagnostics_max_samples: 128
  save_base_model: false
  # When both lists are set, train once and evaluate every inference-only
  # lambda/router combination in the same run.
  eval_lambdas: null
  eval_router_modes: null
