program: src/train.py
project: open-unlearning
method: grid
metric:
  name: eval/strength_4_forget_quality
  goal: maximize

# Rank 16 at seed 42 is supplied by the epoch diagnostic sweep. Coupling
# lora_alpha to rank keeps the PEFT alpha/r scale fixed at one.
parameters:
  trainer.args.seed:
    value: 42
  trainer.args.learning_rate:
    value: 1.0e-4
  trainer.method_args.rank:
    values: [1, 2, 4, 8]
  trainer.method_args.difference_reference:
    value: base
  trainer.method_args.correction_mode:
    value: suppression
  trainer.method_args.diagnostic_strengths:
    value: [2.5, 2.75, 3.0, 3.25, 3.5, 3.75, 4.0, 4.25, 4.5, 4.75, 5.0]

command:
  - uv
  - run
  - python
  - src/train.py
  - --config-name=unlearn.yaml
  - experiment=unlearn/tofu/default.yaml
  - trainer=LoraDiff
  - eval=tofu_lora_diff_diagnostics
  - model=Llama-3.2-1B-Instruct
  - model.model_args.pretrained_model_name_or_path=open-unlearning/tofu_Llama-3.2-1B-Instruct_full
  - model.model_args.attn_implementation=sdpa
  - forget_split=forget10
  - retain_split=retain90
  - holdout_split=holdout10
  - retain_logs_path=saves/eval/tofu_Llama-3.2-1B-Instruct_retain90/TOFU_EVAL.json
  - trainer.method_args.lora_alpha=${trainer.method_args.rank}
  - trainer.args.num_train_epochs=10
  - trainer.args.per_device_train_batch_size=8
  - trainer.args.report_to=wandb
  - trainer.args.eval_strategy=no
  - trainer.args.eval_on_start=False
  - task_name=sweep_lora_diff_base_suppression_rank${trainer.method_args.rank}_${oc.env:WANDB_RUN_ID}
  - ${args_no_hyphens}
