# Optional registration command (not run automatically):
# wandb sweep sweeps/lora_diff_tofu_1b.yaml
# Launch after registration: wandb agent <entity/project/sweep_id>

program: src/train.py
project: lora-diff
method: grid
metric:
  name: eval/forget_quality
  goal: maximize

# 2 learning rates x 2 ranks x 4 correction strengths = 16 runs.
parameters:
  trainer.args.learning_rate:
    values: [1.0e-5, 1.0e-4]
  trainer.method_args.rank:
    values: [8, 16]
  trainer.method_args.strength:
    values: [0.5, 1.0, 1.5, 2.0]

command:
  - uv
  - run
  - python
  - src/train.py
  - --config-name=unlearn.yaml
  - experiment=unlearn/tofu/default.yaml
  - trainer=LoraDiff
  - model=Llama-3.2-1B-Instruct
  - model.model_args.pretrained_model_name_or_path=open-unlearning/tofu_Llama-3.2-1B-Instruct_full
  - model.model_args.attn_implementation=sdpa
  - forget_split=forget10
  - retain_split=retain90
  - holdout_split=holdout10
  - retain_logs_path=saves/eval/tofu_Llama-3.2-1B-Instruct_retain90/TOFU_EVAL.json
  - trainer.args.num_train_epochs=5
  - trainer.args.per_device_train_batch_size=8
  - trainer.args.report_to=wandb
  - trainer.args.eval_strategy=no
  - trainer.args.eval_on_start=False
  - task_name=sweep_lora_diff_lr${trainer.args.learning_rate}_rank${trainer.method_args.rank}_strength${trainer.method_args.strength}_${oc.env:WANDB_RUN_ID}
  - ${args_no_hyphens}
