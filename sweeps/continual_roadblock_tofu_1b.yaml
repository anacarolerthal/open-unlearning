program: src/continual_unlearn.py
project: continual-open-unlearning
method: grid
metric:
  # Select distributionally valid forgetting; answer probability alone
  # favored catastrophic over-unlearning in the exploratory sweep.
  name: eval/continual_forget_quality
  goal: maximize

parameters:
  trainer.method_args.classifier:
    values: [oracle, guard_multiclass, guard_prototype]
  trainer.args.seed:
    # Fresh confirmation seeds; seed 42 was used to identify this region.
    values: [43, 44, 45, 46, 47]
  trainer.args.learning_rate:
    values: [2.0e-3, 3.0e-3, 4.0e-3]
  trainer.args.max_steps:
    values: [20, 30]
  trainer.method_args.strength:
    values: [15.0, 20.0]

command:
  - uv
  - run
  - python
  - src/continual_unlearn.py
  - --config-name=continual_unlearn.yaml
  - trainer=RoadBlock
  - model=Llama-3.2-1B-Instruct
  - model.model_args.pretrained_model_name_or_path=open-unlearning/tofu_Llama-3.2-1B-Instruct_full
  - model.model_args.attn_implementation=sdpa
  - trainer.args.num_train_epochs=10
  - trainer.args.per_device_train_batch_size=8
  - trainer.args.gradient_accumulation_steps=4
  - trainer.args.weight_decay=0.01
  - trainer.args.warmup_ratio=0.1
  - trainer.args.lr_scheduler_type=linear
  - trainer.args.report_to=wandb
  - seed=${trainer.args.seed}
  - task_name=sweep_continual_roadblock_${trainer.method_args.classifier}_seed${trainer.args.seed}_${oc.env:WANDB_RUN_ID}
  - ${args_no_hyphens}
